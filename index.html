function measurements(){let types=['waist','hips','thigh','arm','chest'],entries=[...state.measurements].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="row"><h1>${t('body')}</h1><button class="btn alt small" onclick="nav('wellness')">${t('back')}</button></div><div class="card"><label>${t('date')}</label><input type="date" class="field" id="measureDate" value="${selectedDate}">${types.map(k=>`<label>${t(k)} (cm)</label><input type="number" min="0" step="0.1" inputmode="decimal" class="field" id="measure_${k}" placeholder="—">`).join('')}<button class="btn full" style="margin-top:15px" onclick="addMeasurement()">+ ${t('addMeasurement')}</button></div><h2>${t('recent')}</h2>${entries.map(e=>`<div class="card"><div class="row"><b>${esc(e.date)}</b><button class="btn ghost small" onclick="deleteMeasurement('${e.id}')">${t('delete')}</button></div><div class="summary">${types.filter(k=>e[k]!=null).map(k=>`${t(k)}: ${esc(e[k])} cm`).join(' · ')}</div></div>`).join('')||`<div class="card empty">${t('body')}</div>`}`}function addMeasurement(){let date=$('measureDate').value;if(!validDate(date)){alert(msg('Invalid date','تاريخ غير صحيح'));return}let e={id:uid(),date},has=false;for(let k of ['waist','hips','thigh','arm','chest']){let v=$('measure_'+k).value;if(v!==''){if(!Number.isFinite(+v)||+v<=0){alert(msg('Enter positive measurements','أدخلي قياسات أكبر من صفر'));return}e[k]=+v;has=true}}if(!has){alert(msg('Enter at least one measurement','أدخلي قياسًا واحدًا على الأقل'));return}state.measurements.push(e);save();render()}function deleteMeasurement(id){if(confirm(msg('Delete measurement?','حذف القياس؟'))){state.measurements=state.measurements.filter(x=>x.id!==id);save();render()}}
function history(){return `<div class="row"><h1>${t('history')}</h1><button class="btn alt small" onclick="nav('calendar')">▦ ${t('calendar')}</button></div>${[...state.sessions].reverse().map(s=>`<div class="card"><div class="row"><h3>${esc(s.planName)}</h3><span class="pill">${esc(s.date)}</span></div>${s.exercises.map(e=>`<div class="historyitem"><b>${esc(e.name)}</b><div class="muted">${e.sets.map(x=>`${esc(x.weight)} kg × ${esc(x.reps)}`).join(' · ')}</div></div>`).join('')}<button class="btn ghost small" style="margin-top:12px" onclick="deleteSession('${s.id}')">${t('delete')}</button></div>`).join('')||`<div class="card empty">${t('emptyHistory')}</div>`}`}function deleteSession(id){if(confirm(msg('Delete this session?','حذف جلسة التمرين؟'))){state.sessions=state.sessions.filter(x=>x.id!==id);save();render()}}
function settings(){return `<h1>${t('settings')}</h1><div class="card"><h3>🌐 ${t('language')}</h3><div class="actions"><button class="btn ${pref.lang==='en'?'':'alt'}" onclick="changeLang('en')">English</button><button class="btn ${pref.lang==='ar'?'':'alt'}" onclick="changeLang('ar')">العربية</button></div></div><div class="card"><h3>✦ ${t('appearance')}</h3><div class="swatches">${[['light','#f5e9df'],['soft','#38221c'],['dark','#090808']].map(([k,c])=>`<button class="swatch ${pref.theme===k?'on':''}" onclick="changeTheme('${k}')"><span class="dot" style="background:${c}"></span>${t(k)}</button>`).join('')}</div></div><div class="card"><h3>↧ ${t('backup')}</h3><p class="muted">${msg('Includes workouts, wellness, weight, and measurements.','تشمل النسخة التمارين والمتابعة اليومية والوزن والقياسات.')}</p><button class="btn full" onclick="backup()">↓ ${t('export')}</button><label>${t('import')} (JSON)</label><input class="field" type="file" accept=".json,application/json" onchange="restore(event)"></div><div class="card"><h3>${t('reset')}</h3><button class="btn danger full" onclick="resetAll()">${t('reset')}</button></div>`}function changeLang(v){pref.lang=v;savePref();render()}function changeTheme(v){pref.theme=v;savePref();render()}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-progress-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function restore(ev){let f=ev.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.plans)||!Array.isArray(data.sessions)||data.daily&&typeof data.daily!=='object'||data.weights&&!Array.isArray(data.weights)||data.measurements&&!Array.isArray(data.measurements))throw Error('invalid');if(!confirm(msg('Replace your current records with this backup?','استبدال جميع بياناتك الحالية بهذه النسخة؟')))return;state={...defaults(),...data,measurements:data.measurements||[]};save();render()}catch{alert(msg('Invalid backup file','ملف النسخة الاحتياطية غير صالح'))}}function resetAll(){if(confirm(msg('Delete ALL saved records? Export a backup first.','حذف جميع البيانات؟ صدّري نسخة احتياطية أولًا.'))&&confirm(msg('Confirm permanent deletion','تأكيد الحذف النهائي'))){state=defaults();save();nav('home')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
