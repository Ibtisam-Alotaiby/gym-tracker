function byId(id){return state.plans.find(p=>p.id===id)}function addPlan(){let n=ask(msg('Routine name','اسم الجدول'));if(n?.trim()){state.plans.push({id:uid(),name:n.trim(),exercises:[]});save();render()}}function renamePlan(id){let p=byId(id),n=ask(msg('Routine name','اسم الجدول'),p.name);if(n?.trim()){p.name=n.trim();save();render()}}function removePlan(id){if(confirm(msg('Delete this routine? Saved workout history remains.','حذف الجدول؟ سيبقى سجل التمارين محفوظًا.'))){state.plans=state.plans.filter(p=>p.id!==id);save();render()}}function addExercise(id){let n=ask(msg('Exercise name','اسم التمرين'));if(n?.trim()){byId(id).exercises.push({id:uid(),name:n.trim()});save();render()}}function previousFor(e,planId){return [...state.sessions].filter(s=>s.planId===planId).sort((a,b)=>a.date.localeCompare(b.date)||(a.startedAt||0)-(b.startedAt||0)).reverse().flatMap(s=>s.exercises.filter(x=>x.id===e.id||x.name===e.name).map(x=>({...x,date:s.date}))).at(0)}function start(id){let p=byId(id);if(!p)return;draft={id:uid(),startedAt:Date.now(),planId:id,planName:p.name,date:today(),exercises:[]};tab='log';render()}

function startTimer(){restEnd=Date.now()+restDuration*1000;clearInterval(restTimer);restTimer=setInterval(updateTimer,250);updateTimer()}function stopTimer(redraw=true){restEnd=0;clearInterval(restTimer);restTimer=null;if(redraw)updateTimer()}function updateTimer(){let remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));let text=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;if($('timerClock'))$('timerClock').textContent=text;if($('timerLabel'))$('timerLabel').textContent=text;if(!remaining&&restEnd){stopTimer(false);if(navigator.vibrate)navigator.vibrate([180,90,180]);} }
function dateSelector(){return `<div class="card"><div class="row"><b>▦ ${t('thisDay')}</b><input class="field" style="width:165px" type="date" value="${selectedDate}" onchange="chooseDate(this.value)"></div><div class="actions"><button class="btn alt small" onclick="chooseDate('${shiftDate(selectedDate,-1)}')">←</button><button class="btn alt small" onclick="chooseDate('${today()}')">${t('today')}</button><button class="btn alt small" onclick="chooseDate('${shiftDate(selectedDate,1)}')">→</button></div></div>`}function chooseDate(v){if(validDate(v)){selectedDate=v;render()}}function adjustDaily(key,n){daily()[key]=Math.max(0,(+daily()[key]||0)+n);save();render()}function setSteps(v){daily().steps=Math.max(0,Math.round(+v||0));save();render()}function setGoal(key){let n=numeric(t('goal')+' '+t(key),state.goals[key],false);if(n!==null){state.goals[key]=n;save();render()}}function addWeight(){let n=numeric(t('weight')+' (kg)',state.weights.at(-1)?.kg||70,false);if(n===null)return;let date=ask(t('date'),selectedDate);if(!validDate(date)){alert(msg('Invalid date','تاريخ غير صحيح'));return}state.weights.push({id:uid(),date,kg:n});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function deleteWeight(id){if(confirm(msg('Delete weight entry?','حذف سجل الوزن؟'))){state.weights=state.weights.filter(w=>w.id!==id);save();render()}}
function wellness(){let d=state.daily[selectedDate]||{water:0,calories:0,steps:0},w=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=w.filter(x=>x.date<=selectedDate).at(-1),g=state.goals;return `<h1>${t('daily')}</h1>${dateSelector()}<div class="card"><div class="row"><div><div class="muted">⚖ ${t('lastWeight')}</div><div class="metric">${last?esc(last.kg)+' kg':'—'}</div><div class="tiny">${last?.date||t('noWeights')}</div></div><button class="btn small" onclick="addWeight()">+ ${t('logWeight')}</button></div></div><div class="card"><div class="row"><h3>💧 ${t('water')}</h3><b>${fmt(d.water)} / ${fmt(g.water)} ml</b></div>${progressBar(d.water,g.water,'water')}<div class="actions"><button class="btn alt" onclick="adjustDaily('water',100)">+100 ml</button><button class="btn alt" onclick="adjustDaily('water',330)">+330 ml</button><button class="btn ghost" onclick="adjustDaily('water',-100)">−100</button></div><button class="btn ghost small" style="margin-top:12px" onclick="setGoal('water')">⚙ ${t('goal')}</button></div><div class="card"><div class="row"><h3>🔥 ${t('calories')}</h3><b>${fmt(d.calories)} / ${fmt(g.calories)}</b></div>${progressBar(d.calories,g.calories,'calories')}<div class="row"><span class="muted">${t('calAdd')}</span><strong id="calPreview">200 kcal</strong></div><input class="slider" id="calSlider" type="range" min="0" max="1500" step="1" value="200" oninput="$('calPreview').textContent=this.value+' kcal'"><button class="btn full" onclick="adjustDaily('calories',+$('calSlider').value)">+ ${t('addToday')}</button><div class="actions"><button class="btn ghost small" onclick="adjustDaily('calories',-1)">−1</button><button class="btn ghost small" onclick="adjustDaily('calories',1)">+1</button><button class="btn ghost small" onclick="setGoal('calories')">⚙ ${t('goal')}</button></div></div><div class="card"><div class="row"><h3>👟 ${t('steps')}</h3><b>${fmt(d.steps)} / ${fmt(g.steps)}</b></div>${progressBar(d.steps,g.steps,'steps')}<div c function buildXlsx(sheets){let files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xmlEscape(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'</Relationships>']];sheets.forEach((s,i)=>files.push(['xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(s.rows)]));return zipStored(files)}
function exportExcel(){let blob=buildXlsx(excelSheets()),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='gym-progress-'+($('reportPeriod')?.value||'all')+'-'+today()+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function newPeriod(){if(!confirm(msg('Start a new period? Previous records will remain saved in the archive. Export Excel and a JSON backup first.','بدء فترة جديدة؟ ستبقى السجلات السابقة محفوظة في الأرشيف. صدّري Excel ونسخة JSON احتياطية أولًا.')))return;if(!confirm(msg('Have you saved your backup?','هل حفظتِ نسختك الاحتياطية؟')))return;state.periodStart=today();save();nav('home');alert(msg('New period started. Old records were not deleted.','بدأت فترة جديدة، ولم تُحذف السجلات القديمة.'))}
function changeLang(v){pref.lang=v;savePref();render()}function changeTheme(v){pref.theme=v;savePref();render()}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-progress-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function restore(ev){let f=ev.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.plans)||!Array.isArray(data.sessions)||data.daily&&typeof data.daily!=='object'||data.weights&&!Array.isArray(data.weights)||data.measurements&&!Array.isArray(data.measurements))throw Error('invalid');if(!confirm(msg('Replace your current records with this backup?','استبدال جميع بياناتك الحالية بهذه النسخة؟')))return;state={...defaults(),...data,measurements:data.measurements||[]};save();render()}catch{alert(msg('Invalid backup file','ملف النسخة الاحتياطية غير صالح'))}}function resetAll(){if(confirm(msg('Delete ALL saved records? Export a backup first.','حذف جميع البيانات؟ صدّري نسخة احتياطية أولًا.'))&&confirm(msg('Confirm permanent deletion','تأكيد الحذف النهائي'))){state=defaults();save();nav('home')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
